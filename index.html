<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>My Pinterest Clone</h1>
    </header>
    <div class="grid">
        <div class="pin"><img src="https://source.unsplash.com/random/300x400/?nature" alt="Pin 1"></div>
        <div class="pin"><img src="https://source.unsplash.com/random/300x500/?travel" alt="Pin 2"></div>
        <div class="pin"><img src="https://source.unsplash.com/random/300x300/?food" alt="Pin 3"></div>
        <div class="pin"><img src="https://source.unsplash.com/random/300x600/?art" alt="Pin 4"></div>
        <div class="pin"><img src="https://source.unsplash.com/random/300x350/?design" alt="Pin 5"></div>
        <div class="pin"><img src="https://source.unsplash.com/random/300x450/?fashion" alt="Pin 6"></div>
        <div class="pin"><img src="https://source.unsplash.com/random/300x550/?architecture" alt="Pin 7"></div>
        <div class="pin"><img src="https://source.unsplash.com/random/300x400/?animals" alt="Pin 8"></div>
        <div class="pin"><img src="https://source.unsplash.com/random/300x500/?technology" alt="Pin 9"></div>
        <div class="pin"><img src="https://source.unsplash.com/random/300x300/?abstract" alt="Pin 10"></div>
    </div>
</body>
</html>
