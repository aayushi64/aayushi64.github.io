<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Clone</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header class="header">
        <a href="#" class="logo">
            <img src="https://s.pinimg.com/webapp/logo-1x-0f5b9a36.png" alt="Pinterest" class="logo-img">
        </a>

        <nav class="nav">
            <a href="#" class="nav-link active">Home</a>
            <a href="#" class="nav-link">Explore</a>
            <a href="#" class="nav-link">Create</a>
        </nav>
        
        <div class="search-bar desktop-search">
            <i class="fas fa-magnifying-glass search-icon"></i>
            <input type="text" placeholder="Search">
        </div>
        
        <a href="#" class="mobile-search-icon"><i class="fas fa-magnifying-glass"></i></a>
        
        <div class="icons">
            <a href="#" class="icon"><i class="far fa-bell"></i></a>
            <a href="#" class="icon"><i class="far fa-message"></i></a>
            <a href="#" class="profile"><i class="far fa-user"></i></a>
        </div>
    </header>

    <nav class="bottom-nav">
        <a href="#" class="bottom-icon active"><i class="fas fa-home"></i></a>
        <a href="#" class="bottom-icon"><i class="fas fa-magnifying-glass"></i></a>
        <a href="#" class="bottom-icon"><i class="fas fa-plus"></i></a>
        <a href="#" class="bottom-icon"><i class="far fa-bell"></i></a>
        <a href="#" class="bottom-icon"><i class="far fa-user"></i></a>
    </nav>

    <main class="masonry-grid">
        <!-- Replace the src with your actual image URLs -->
        <div class="pin">
            <img src="https://via.placeholder.com/600x800/fde4cf/333333?text=Weak+Hero+Class+1+Collage" alt="Weak Hero Class 1 moodboard">
            <div class="overlay">
                <button class="save-btn">Save</button>
                <div class="more-options">
                    <i class="fas fa-ellipsis-h"></i>
                    <div class="options-menu">
                        <a href="#"><i class="fas fa-share"></i> Share</a>
                        <a href="#"><i class="fas fa-link"></i> Copy link</a>
                        <a href="#"><i class="fas fa-download"></i> Save</a>
                    </div>
                </div>
            </div>
            <div class="caption">
                <p>Weak Hero Class 1 vibes 📚✏️</p>
            </div>
        </div>

        <div class="pin">
            <img src="https://via.placeholder.com/600x600/fde4cf/333333?text=Psyduck+Burning+Laptop" alt="Psyduck stressed meme">
            <div class="overlay">
                <button class="save-btn">Save</button>
                <div class="more-options">
                    <i class="fas fa-ellipsis-h"></i>
                    <div class="options-menu">
                        <a href="#"><i class="fas fa-share"></i> Share</a>
                        <a href="#"><i class="fas fa-link"></i> Copy link</a>
                        <a href="#"><i class="fas fa-download"></i> Save</a>
                    </div>
                </div>
            </div>
            <div class="caption">
                <p>When finals week hits 🔥💻</p>
            </div>
        </div>

        <!-- You can duplicate more pins here with your own images -->
    </main>
</body>
</html>
