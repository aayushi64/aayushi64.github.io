<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Clone</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header class="header">
        <a href="#" class="logo">
            <img src="https://s.pinimg.com/webapp/logo-1x-0f5b9a36.png" alt="Pinterest" class="logo-img">
        </a>

        <nav class="nav">
            <a href="#" class="nav-link">Home</a>
            <a href="#" class="nav-link active">Today</a>
            <a href="#" class="nav-link">Explore</a>
            <a href="#" class="nav-link">Create</a>
        </nav>
        
        <div class="search-bar desktop-search">
            <i class="fas fa-magnifying-glass search-icon"></i>
            <input type="text" placeholder="Search">
        </div>
        
        <a href="#" class="mobile-search-icon"><i class="fas fa-magnifying-glass"></i></a>
        
        <div class="icons">
            <a href="#" class="icon"><i class="far fa-bell notification-icon"></i></a>
            <a href="#" class="icon"><i class="far fa-message"></i></a>
            <a href="#" class="profile"><i class="far fa-user"></i></a>
        </div>
    </header>

    <nav class="bottom-nav">
        <a href="#" class="bottom-icon active"><i class="fas fa-home"></i></a>
        <a href="#" class="bottom-icon"><i class="fas fa-magnifying-glass"></i></a>
        <a href="#" class="bottom-icon"><i class="fas fa-plus"></i></a>
        <a href="#" class="bottom-icon notification-icon"><i class="far fa-bell"></i></a>
        <a href="#" class="bottom-icon"><i class="far fa-user"></i></a>
    </nav>

    <main class="masonry-grid">
        <!-- Pin 1 -->
        <div class="pin tall-pin">
            <img src="https://via.placeholder.com/600x900/fde4cf/333333?text=Weak+Hero+Class+1+Collage" alt="">
            <div class="overlay">
                <div class="overlay-buttons">
                    <button class="icon-btn upload-btn"><i class="fas fa-upload"></i></button>
                    <button class="icon-btn link-btn"><i class="fas fa-external-link-alt"></i></button>
                    <button class="save-btn">Save</button>
                </div>
                <div class="more-options">
                    <i class="fas fa-ellipsis-h"></i>
                    <i class="fas fa-arrow-up arrow-icon"></i>
                    <div class="options-menu">
                        <a href="#"><i class="fas fa-heart"></i> See more like this</a>
                        <a href="#"><i class="fas fa-eye-slash"></i> See less like this</a>
                        <a href="#"><i class="fas fa-download"></i> Download image</a>
                        <a href="#"><i class="fas fa-flag"></i> Report Pin</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pin 2 -->
        <div class="pin medium-pin">
            <img src="https://via.placeholder.com/600x600/fde4cf/333333?text=Psyduck+Burning+Laptop" alt="">
            <div class="overlay">
                <div class="overlay-buttons">
                    <button class="icon-btn upload-btn"><i class="fas fa-upload"></i></button>
                    <button class="icon-btn link-btn"><i class="fas fa-external-link-alt"></i></button>
                    <button class="save-btn">Save</button>
                </div>
                <div class="more-options">
                    <i class="fas fa-ellipsis-h"></i>
                    <i class="fas fa-arrow-up arrow-icon"></i>
                    <div class="options-menu">
                        <a href="#"><i class="fas fa-heart"></i> See more like this</a>
                        <a href="#"><i class="fas fa-eye-slash"></i> See less like this</a>
                        <a href="#"><i class="fas fa-download"></i> Download image</a>
                        <a href="#"><i class="fas fa-flag"></i> Report Pin</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add more pins as needed -->
    </main>
</body>
</html>
